<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Painel Administrativo | Amanteigados Lívia</title>
  <meta name="robots" content="noindex, nofollow" />
  <meta name="description" content="Painel administrativo do catálogo Amanteigados Lívia." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="admin.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='48' fill='%237A3E48'/%3E%3Ctext x='50' y='66' font-size='48' text-anchor='middle' fill='white' font-family='Georgia'%3EA%3C/text%3E%3C/svg%3E" />
</head>
<body>
  <div id="loginView" class="login-shell hidden">
    <form id="loginForm" class="login-card" autocomplete="off">
      <img src="assets/logo.jpg" alt="" width="88" height="88" />
      <p class="eyebrow">Amanteigados Lívia</p>
      <h1>Painel Administrativo</h1>
      <label for="adminEmail">E-mail</label>
      <input id="adminEmail" name="email" type="email" autocomplete="username" required />
      <label for="adminPassword">Senha</label>
      <input id="adminPassword" name="senha" type="password" autocomplete="current-password" required />
      <button type="submit" class="btn btn-primary" id="loginButton">Entrar</button>
      <p id="loginError" class="form-error" role="alert" hidden></p>
    </form>
  </div>

  <div id="appView" class="admin-shell hidden">
    <div id="sidebarBackdrop" class="sidebar-backdrop hidden"></div>
    <aside class="admin-sidebar" id="adminSidebar">
      <div class="sidebar-brand">
        <img src="assets/logo.jpg" alt="" width="48" height="48" />
        <div>
          <strong>Amanteigados Lívia</strong>
          <span>Homologação</span>
        </div>
      </div>
      <nav class="admin-nav" aria-label="Menu do painel">
        <button type="button" class="nav-btn is-active" data-view="overview">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 13h7V4H4v9Zm9 7h7v-9h-7v9ZM4 20h7v-5H4v5Zm9-9h7V4h-7v7Z" fill="currentColor"/></svg>
          Visão Geral
        </button>
        <p class="nav-label">Catálogo</p>
        <button type="button" class="nav-btn" data-view="categories">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16v2H4V6Zm0 5h16v2H4v-2Zm0 5h10v2H4v-2Z" fill="currentColor"/></svg>
          Categorias
        </button>
        <button type="button" class="nav-btn" data-view="products">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4h10l3 7H4l3-7Zm-3 9h16v7H4v-7Z" fill="currentColor"/></svg>
          Produtos
        </button>
        <button type="button" class="nav-btn" data-view="sales">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 18a2 2 0 1 0 0 4 2 2 0 0 0 0-4Zm10 0a2 2 0 1 0 0 4 2 2 0 0 0 0-4ZM3 3h3l2.4 10.4A2 2 0 0 0 10.3 15H18a2 2 0 0 0 1.9-1.4L22 7H7" fill="currentColor"/></svg>
          Vendas
        </button>
        <button type="button" class="nav-btn" data-view="reports">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 19V9h3v10H5Zm6 0V5h3v14h-3Zm6 0v-7h3v7h-3Z" fill="currentColor"/></svg>
          Relatórios
        </button>
        <button type="button" class="nav-btn" data-view="publications">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 4 7v6c0 5 3.4 8.4 8 9 4.6-.6 8-4 8-9V7l-8-4Z" fill="currentColor"/></svg>
          Publicações
        </button>
        <button type="button" class="nav-btn" data-view="audit">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4h12v16H6V4Zm3 4h6v2H9V8Zm0 4h6v2H9v-2Z" fill="currentColor"/></svg>
          Auditoria
        </button>
        <button type="button" class="nav-btn" data-view="users">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 12a4 4 0 1 0-4-4 4 4 0 0 0 4 4Zm-8 8a8 8 0 0 1 16 0H4Z" fill="currentColor"/></svg>
          Usuários
        </button>
      </nav>
      <button type="button" class="btn btn-ghost" id="logoutButton">Sair</button>
    </aside>

    <main class="admin-main">
      <header class="admin-header">
        <button type="button" class="icon-btn" id="menuToggle" aria-label="Abrir menu">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round"/></svg>
        </button>
        <div>
          <p class="eyebrow" id="viewEyebrow">Painel</p>
          <h1 id="viewTitle">Visão Geral</h1>
          <p class="breadcrumb" id="viewBreadcrumb">Início / Visão Geral</p>
        </div>
      </header>
      <section id="overviewView" class="view-panel"></section>
      <section id="categoriesView" class="view-panel hidden"></section>
      <section id="productsView" class="view-panel hidden"></section>
      <section id="salesView" class="view-panel hidden"></section>
      <section id="reportsView" class="view-panel hidden"></section>
      <section id="publicationsView" class="view-panel hidden"></section>
      <section id="auditView" class="view-panel hidden"></section>
      <section id="usersView" class="view-panel hidden"></section>
    </main>
  </div>

  <div id="toastRegion" class="toast-region" aria-live="polite"></div>

  <dialog id="formDialog" class="admin-dialog">
    <form id="resourceForm" method="dialog"></form>
  </dialog>

  <script src="admin.js"></script>
</body>
</html>
